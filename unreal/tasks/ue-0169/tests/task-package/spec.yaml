task_id: ue_task_0169
title: "RTS combat and player presentation —"
tier: hard
instruction: "Implement unit combat and the player-facing systems for the supplied two-faction RTS: orders and navigation, selection and camera controls, HUD, world overlays, and audiovisual feedback. A player should be able to command a real army and understand what is happening during a complete match. Read `/project/gdd.md` for the game design, implementation details and editable files. The faction economy, construction, production and AI strategy are supplied. Preserve those systems and connect actual player input and presentation to their existing interfaces. Validate through local builds and tests, then submit changes only to the listed files."
files_to_edit: ["Shaders/RTSOverlayPrimitive.ush", "Source/RTS/Private/Camera/RTSCameraPawn.cpp", "Source/RTS/Private/Combat/RTSHealthComponent.cpp", "Source/RTS/Private/Combat/RTSTurretCombatComponent.cpp", "Source/RTS/Private/Game/RTSHUD.cpp", "Source/RTS/Private/Game/RTSPlayerController.cpp", "Source/RTS/Private/Orders/RTSCommandSubsystem.cpp", "Source/RTS/Private/Orders/RTSUnitOrderComponent.cpp", "Source/RTS/Private/Presentation/RTSPresentationSubsystem.cpp", "Source/RTS/Private/Presentation/RTSTransientEffect.cpp", "Source/RTS/Private/Presentation/RTSWorldOverlayActor.cpp", "Source/RTS/Private/Presentation/RTSWorldOverlaySubsystem.cpp", "Source/RTS/Private/Selection/RTSSelectionSubsystem.cpp", "Source/RTS/Private/Structures/RTSDeploymentViewSubsystem.cpp", "Source/RTS/Private/UI/RTSHUDSnapshot.cpp", "Source/RTS/Private/UI/SRTSStatusOverlay.cpp", "Source/RTS/Private/Units/RTSCombatUnit.cpp", "Source/RTS/Private/Units/RTSUnitController.cpp", "Source/RTS/Private/Units/RTSUnitRegistrySubsystem.cpp"]
