; The facility's tuning, read by UFacilitySettings when a level starts and shown under Project
; Settings > Game > Facility. Everything the route graph depends on that is not placement lives here:
; the clock, the alarm, the handheld, the generator, the flood, what each door's lock takes, what lies
; at each pickup and the handheld level each device needs, keyed by the ids set on the placed actors.
; An entry no placed actor claims is reported in the log when play begins.
[/Script/ScifiSimEscape.FacilitySettings]
StepSeconds=5
AlarmDecaySteps=6
HandheldLevel=1
ServerDriveHandheldLevel=2
GeneratorRunSteps=10
FloodShortSteps=1
CorrosionSteps=4
; What each door's lock takes: a keycard level, a key item or both. A door not listed has no lock.
+DoorLocks=(Id="Door_Corridor",LockLevel=2)
+DoorLocks=(Id="Door_Security",LockLevel=2)
+DoorLocks=(Id="Gate_Main",LockLevel=3)
+DoorLocks=(Id="Locker_Storage",LockLevel=2)
+DoorLocks=(Id="Locker_Weapons",LockLevel=2)
+DoorLocks=(Id="TunnelDoor",KeyItem=ServiceKey)
; What lies at each pickup. The placed pickup with that PickupId is the location.
+Pickups=(Id="Pickup_PryBar",Item=PryBar)
+Pickups=(Id="Pickup_ServerDrive",Item=ServerDrive)
+Pickups=(Id="Pickup_Keycard2",Item=Keycard2)
+Pickups=(Id="Pickup_ServiceKey",Item=ServiceKey)
+Pickups=(Id="Pickup_ImprovisedWeapon",Item=ImprovisedWeapon)
+Pickups=(Id="Pickup_Firearm",Item=Firearm)
+Pickups=(Id="Pickup_Keycard3",Item=Keycard3)
+Pickups=(Id="Pickup_LockerItem",Item=LockerItem)
; Handheld level each device needs. A device not listed is nothing the handheld works on.
+HackTargets=(Id="Door_Corridor",Level=1)
+HackTargets=(Id="Door_Security",Level=1)
+HackTargets=(Id="Elevator",Level=1)
+HackTargets=(Id="SecurityCamera",Level=1)
+HackTargets=(Id="GateController",Level=2)
+HackTargets=(Id="AlarmConsole",Level=2)
+HackTargets=(Id="ServerRack",Level=2)
+HackTargets=(Id="RoutingPanel",Level=1)
