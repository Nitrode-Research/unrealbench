hidden_requirements:
  R1:
    text: "A charge command activates only when the charge accumulated through the previous unfrozen frame reaches the requirement, held frames from separately held segments add up, and ordinary input-condition commands keep their existing behavior, also on a state that carries both kinds."
    category: core_logic
  R2:
    text: "A run of unfrozen non-held frames longer than the interruption limit clears the charge on the frame that exceeds it, a run of exactly the limit is kept, and a cleared charge rebuilds from zero."
    category: core_logic
  R3:
    text: "Activation requires the age, counted in unfrozen frames from and including the first held frame through the previous unfrozen frame, to be at most the lifetime, and the frame on which the age exceeds it clears the charge."
    category: core_logic
  R4:
    text: "Triggers are edges between consecutive unfrozen frames with superset input matching, a trigger that stays held does not fire again, activation consumes the charge so a repeated trigger does not re-activate, and the activation frame contributes nothing to the next charge."
    category: core_logic
  R5:
    text: "Frozen frames count neither as held nor as interruption nor toward lifetime, no move starts on them, and an input change made during a freeze is seen as an edge on the first unfrozen frame after it."
    category: core_logic
  R6:
    text: "Charge belongs to the command: a trigger while the move cannot be entered neither activates, consumes, nor is remembered, and that frame accumulates like any other; when several moves could start on one frame, through ordinary lists or charge commands on any states, or several commands of one move are satisfied, the engine's state priority picks the move that starts, only that move's satisfied commands are consumed, and every other command accumulates on that frame, including commands on states the engine's walk never reached; commands of the two players and every command of a state, however many, are tracked independently."
    category: core_logic
  R7:
    text: "Charge is facing-relative and survives a side switch, the previous frame's held status is re-read under the new facing so a stick that stays put across a switch is no edge, and a mirrored input trace with mirrored facing produces identical move starts."
    category: core_logic
  R8:
    text: "A round reset clears all charge and the previous-frame memory, an empty charge input, a requirement below one or a press trigger without a trigger input never activates, a negative interruption limit allows no interruption, and a lifetime below the requirement can never activate because the charge expires first."
    category: core_logic
  R9:
    text: "Save and restore carry charge state and the previous-frame memory so that replaying identical inputs after a restore reproduces identical move starts and a different continuation keeps nothing from the discarded future, including consumption and clearing."
    category: core_logic
