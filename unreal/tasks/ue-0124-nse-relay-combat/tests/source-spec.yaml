tests:
  # One inventory, two lanes: the reward filter and the integration filter. Every
  # test_requirements entry must belong to exactly one lane (automation_suites.py).
  suites:
  - name: reward
    filter: NightSky.Relay
    command_line:
      add_args:
      - -d3d11
      - -sm5
      - -AllowSoftwareRendering
  # Measured: with no Vulkan driver present, GGPOPeers passes and RenderedSample fails, so only
  # the rendered observation needs a device. They are separate lanes so a host without a driver
  # can still grade 34 of the 35 by selecting the two headless lanes.
  - name: peers
    filter: NightSkyIntegration.Relay.GGPOPeers
  - name: rendered
    filter: NightSkyIntegration.Relay.RenderedSample
    # Needs a Vulkan driver available to the child editors this test's Python driver spawns; the
    # parent's -NullRHI is not what decides it. Measured recipe on 5.8.2: mesa 25 (jammy's stock
    # 23.2 crashes the render thread) with lavapipe, and -sm6 produces no results, so -sm5.
    command_line:
      remove_args:
      - -NullRHI
      add_args:
      - -AllowSoftwareRendering
      - -sm5
      - -RenderOffScreen
  runner: ue_automation
  mode: editor
  num_clients: 0
  filter: NightSky.Relay
  # Exact identity checking (verify.ps1 via convert_task expected_tests): reward is the
  # full set of these 32 registered tests, not a bare count. Closes the count-based
  # grader exploit found in QA (see experiments/vc/review-ue-task-0124-20260915.md).
  expected_tests:
  - NightSky.Relay.AsymmetricHitstopClocks
  - NightSky.Relay.CameraAllocationRestore
  - NightSky.Relay.ComboOwnershipAndPromotedRecovery
  - NightSky.Relay.ContactKOPromotesSurvivor
  - NightSky.Relay.EligibilityBoundaries
  - NightSky.Relay.EqualStatSlotRelabeling
  - NightSky.Relay.ExactBoundaries
  - NightSky.Relay.FreezeEdgesAndRecovery
  - NightSky.Relay.FreezeMetamorphicCombat
  - NightSky.Relay.DeepFrozenQueue
  - NightSky.Relay.FrozenArrivalOrder
  - NightSky.Relay.GuardedContactAndWhiff
  - NightSky.Relay.IndependentTeams
  - NightSky.Relay.KOCancellationScope
  - NightSky.Relay.MixedCombatRollbackFuzz
  - NightSky.Relay.OverlappingProjectileCancellation
  - NightSky.Relay.OverlayReflectsRolesAndStatus
  - NightSky.Relay.OverlayPaintsTeams
  - NightSky.Relay.ParticipantKOPhaseMatrix
  - NightSky.Relay.PublicButtonBinding
  - NightSky.Relay.RecoveryConservation
  - NightSky.Relay.RejectedEntryConditions
  - NightSky.Relay.ResourceExhaustion
  - NightSky.Relay.RollbackContinuation
  - NightSky.Relay.RouteCommandEdges
  - NightSky.Relay.SampleSlotSelection
  - NightSky.Relay.SeededLifecycle
  - NightSky.Relay.SimultaneousElimination
