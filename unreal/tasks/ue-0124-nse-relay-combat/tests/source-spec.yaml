hidden_requirements:
  R1:
    text: Selectable two-team three-fighter relay mode with authored melee/projectile/follow-up
      content and ordinary combat.
    category: core_logic
  R2:
    text: Eligibility, separate 100-cost resource, rejection feedback and edge-based
      command handling.
    category: core_logic
  R3:
    text: Phase durations follow the specified gameplay-frame boundaries; route acceptance ends its window that frame, follow-up starts next frame, handoff follows the sixth exit frame, and each enrolled fighter receives the stated cooldown.
    category: core_logic
  R4:
    text: Persistent hit ownership and team combo scaling with ordinary collision/defense/damage.
    category: core_logic
  R5:
    text: Role-dependent recoverable damage, bounded one-per-frame off-screen recovery
      and permanent round KO.
    category: core_logic
  R6:
    text: Contact/KO/timeout/interruption ordering; cancel attacks, preserve reactions,
      no refund and playable surviving roles.
    category: core_logic
  R7:
    text: Elimination, simultaneous draw, team-health timeout, locked end state and
      rematch.
    category: core_logic
  R8:
    text: Super freeze suspends contacts and specified clocks; ordinary asymmetric
      hitstop leaves relay phases, eligibility, cooldown, recovery and round clocks
      advancing, with normal move playback hitstop.
    category: core_logic
  R9:
    text: HUD presents role, health, recovery, cooldown, eligibility, resources and
      rejection; camera includes exposed fighters.
    category: core_logic
  R10:
    text: Lethal training and restart/rematch restore full starting state and clear
      transient attacks/commands.
    category: core_logic
  R11:
    text: Online peers and persisted replay reproduce confirmed combat, roles, resources, timing and results through phases and interruptions.
    category: core_logic
  R12:
    text: Both teams operate independent overlapping relays, including interleaved
      routing, projectiles and cancellation of only one sequence.
    category: core_logic
