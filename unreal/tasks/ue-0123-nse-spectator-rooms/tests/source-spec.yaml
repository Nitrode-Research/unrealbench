hidden_requirements:
  R1:
    text: Validate delay and authenticated organizer controls.
    category: core_logic
  R2:
    text: Seat transfer is idempotent and acknowledged membership and locks survive restart.
    category: core_logic
  R3:
    text: Membership and organizer operations preserve authorization and allow healthy clients to continue.
    category: core_logic
  R4:
    text: Confirmed battle history releases after the configured delay and reconstructs the selected gameplay; interruption outcomes retain their own durable release deadlines.
    category: core_logic
  R5:
    text: Fighters, organizer and three independent spectators preserve authorization and delayed playback across reconnects and authority recovery; exported matches reproduce offline.
    category: core_logic
  R6:
    text: Normal completion records the deciding frame and outcome before delayed export. Later matches preserve the room and retain only the current and two latest finished matches, including interruptions.
    category: core_logic
  R7:
    text: A complete retained-match export preserves configuration, content revisions, participants, initial state and confirmed inputs and reproduces the match offline after restart.
    category: core_logic
  R8:
    text: Player-facing room controls support creation, authentication and organizer operations with visible status.
    category: core_logic
  R9:
    text: Confirmed fighter inputs reproduce authoritative combat despite corrected online play; combat pause and confirmed interruption history remain consistent.
    category: core_logic
  R10:
    text: Seeking presents the destination gameplay without skipped sounds or repeated effects; presentation reveals no unreleased gameplay.
    category: core_logic
  R11:
    text: Authority restart preserves acknowledged membership, locks and queue, interrupts an active match and restores usable authenticated room controls without duplicate owners.
    category: core_logic
  R12:
    text: One room persists through selection, stage travel, rematches, content failure and correction, and seat replacement while rejecting stale owners and preserving independent retained views.
    category: core_logic
  R13:
    text: Delayed release, independent cursors, reconnect recovery and healthy fighter progress remain consistent through room operations; spectator viewing and delay do not alter combat.
    category: core_logic
