task_id: ue_task_0168
title: "RTS faction simulation and strategy —"
tier: hard
instruction: "Implement the faction simulation and AI strategy for the supplied two-faction RTS. Each faction should deploy its command vehicle, build an economy and base, produce an army, reclaim wrecks, and fight toward a single match outcome. Read `/project/gdd.md` for the game design, implementation details and editable files. Unit combat, controls and presentation are supplied; connect your systems to them and preserve their behavior. Use the existing native subsystems and configured costs, timings and limits. Validate through local builds and tests, then submit changes only to the listed files."
files_to_edit: ["Source/RTS/Private/AI/RTSAIStrategyBootstrap.cpp", "Source/RTS/Private/AI/RTSAIStrategySubsystem.cpp", "Source/RTS/Private/Economy/RTSEconomySubsystem.cpp", "Source/RTS/Private/Match/RTSMatchSubsystem.cpp", "Source/RTS/Private/Production/RTSProductionComponent.cpp", "Source/RTS/Private/Production/RTSProductionSubsystem.cpp", "Source/RTS/Private/Reclaim/RTSReclaimComponent.cpp", "Source/RTS/Private/Reclaim/RTSWreckage.cpp", "Source/RTS/Private/Reclaim/RTSWreckageSubsystem.cpp", "Source/RTS/Private/Structures/RTSStructure.cpp", "Source/RTS/Private/Structures/RTSStructureSubsystem.cpp"]
tests:
  runner: ue_automation
  mode: listen_server
  num_clients: 1
  filter: Task0168
  evaluator_entrypoint: verify.py
  injection_module: RTSTests
  suites:
    - name: headless
      filter: Task0168.Headless
    - name: rendered
      filter: Task0168.Rendered
      command_line:
        remove_args: ["-NullRHI"]
        add_args: ["-RenderOffScreen"]
hidden_requirements:
  GAME:
    text: "Both real faction loops complete through submitted gameplay and produce one immutable outcome."
    category: core_logic
  ECONOMY:
    text: "Atomic ledgers, shared reservations, destruction and once-only production/reclaim accounting follow the public contract."
    category: core_logic
  WORLD:
    text: "Deployment, valid placement, construction and navigable production exits drive real world state."
    category: core_logic
  STRATEGY:
    text: "Seeded paid AI deployment, economy, roster, bounded tactical commitments and recovery use shared authorities."
    category: core_logic
  COMBAT:
    text: "Health, movement, order replacement, real damage, death and wreck integration follow the public contract."
    category: core_logic
  VIEW:
    text: "Local selection, camera, input, HUD snapshots, warnings and preview/overlay ownership reflect authoritative state."
    category: core_logic
  PRESENTATION:
    text: "Real event adapters, bounded typed effects/audio and lifetime behavior follow the public contract."
    category: core_logic
  RENDER:
    text: "Required real-RHI HUD/overlay/deployment captures and material pixels execute, not headless skips."
    category: core_logic
