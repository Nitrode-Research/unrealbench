hidden_requirements:
  R1:
    text: "Every export begins with the ASCII magic NSKYCKPT and little-endian schema version 1; an array with that magic and any other version is rejected as unsupported, whatever follows, without changing the battle."
    category: core_logic
  R2:
    text: "Battles of the same configuration and gameplay state in independent worlds export byte-identical non-empty arrays, unaffected by addresses, names, presentation state, freed pool slots or how often export is called, and export has no effect on the battle."
    category: core_logic
  R3:
    text: "Any gameplay difference (battle values, player fields, input history, script fields of current or non-current registered states, off-screen players, runtime collision boxes, references, active objects, extension state, pool slot order) produces different bytes."
    category: core_logic
  R4:
    text: "After import the target reproduces the source battle observations on every later frame under the same inputs, forward or backward in frame number, with no residue from its prior state (non-current registered states included); the target keeps its own configuration; an immediate re-export returns the imported bytes; import runs no gameplay and fires no callback, and importing the same bytes twice equals importing them once."
    category: core_logic
  R5:
    text: "Main players, super freeze caller, owners, attack and ignore-hit links, position and stop links, stored child objects, camera targets (including references to inactive slots) and every player current state (on screen or not, bound to the target's registered state of that name) are restored to the target instance objects; object scripts carry the checkpoint saved fields rather than template values; templates stay the target's and later spawns, even into a restored object's slot, use them; slots inactive in the checkpoint are inactive afterwards."
    category: core_logic
  R6:
    text: "The update order of every pool slot, the slot each active object occupies and battle extension state are restored, and exports of different pool capacities differ."
    category: core_logic
  R7:
    text: "Damaged arrays (short, wrong magic, altered, truncated, extended) are rejected as malformed (a version-field edit as unsupported), differing lineups (team size, class, capacity, extensions by class and name in order, a state the target has not registered) as lineup mismatches, arbitrary bytes never crash, and every rejection leaves the battle unchanged in bytes and in later frames."
    category: error_handling
  R8:
    text: "The existing rollback snapshot save and load still round-trip an identical-input replay to exact integer state."
    category: regression
  R9:
    text: "A newly activated pooled object has no collision boxes until its script sets a cel, so it carries none right after activation and a fresh spawn into a freed slot cannot be hit on its spawn frame."
    category: core_logic
