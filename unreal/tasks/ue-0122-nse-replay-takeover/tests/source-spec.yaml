# Integration-only tests: excluded from the RLVR reward filter (renamed to the
# UnrealBenchIntegration.* namespace in the test source so the reward filter
# `UnrealBench.ReplayTakeover` no longer matches them). Run separately with
# filter `UnrealBenchIntegration.ReplayTakeover` as a non-reward correctness gate.
# FreshProcessPersistence boots a second editor and AddError-fails (not skips)
# when the host lacks two-editor capacity, so its verdict depends on infra, not
# the solution. R3/R5 remain fully covered by the reward tests above.
# PresentationFence does SceneCapture/ReadPixels and needs a real RHI (SIGSEGVs
# under -NullRHI), so it is eval-only on a CPU RLVR fleet. Every presentation
# channel it observes that does not need real hardware is now graded:
# HeadlessPresentationFence covers HUD, collision debug and intermediate
# fighter/camera transforms (USceneComponent::TransformUpdated needs no RHI),
# HeadlessAudioFence covers started/stopped common audio through AAudioManager's
# native observer (which reports under -NoSound), and CommonParticleFence covers
# the native common-effect boundary and lifetime. What stays integration-only is
# the positive controls that do need hardware: actual pixels (HlslParticleFence)
# and real-device audio playback.
integration_tests:
  UnrealBenchIntegration.ReplayTakeover.FreshProcessPersistence: [R3, R5]
  UnrealBenchIntegration.ReplayTakeover.PresentationFence: [R7]
  UnrealBenchIntegration.ReplayTakeover.HlslParticleFence: [R7]
