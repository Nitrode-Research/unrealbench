task_id: ue_task_0171
title: "Foundations world and paired movement —"
tier: hard
instruction: "Implement world generation and the paired-character runtime for the supplied Foundations puzzle game. Build native geometry from the provided exports, and implement movement, navigation, cable simulation and camera behavior for two connected characters. Read `/project/gdd.md` for the game design, coordinate conventions, behavior and editable files. Story, interactions, inventory, saving and HUD are supplied. Preserve that implementation, including its functions in shared files, and keep the EntryGate-to-LoadingDocks game playable. Use the provided architecture and data, validate with local builds and tests, and submit only the listed implementation changes."
