hidden_requirements:
  R1:
    text: Opt-in translation sweeps support fixed oriented boxes using truncated integer
      half-sizes, including odd dimensions and collapsed segments or points for both
      moving participants within the stated coordinate range; default endpoint behavior
      remains unchanged.
    category: core_logic
  R2:
    text: Closed contact intervals, earliest box-pair contact per target, exact time
      ordering and authored target contact-order keys govern selection.
    category: core_logic
  R3:
    text: Non-piercing consumes one target; piercing applies its lifetime distinct-target
      limit in order, skips excluded targets, and deactivates at exhaustion.
    category: core_logic
  R4:
    text: Accepted contacts retain ordinary damage, guard, armor, callbacks and hitstop
      without duplicate endpoint processing; explicit callback disable/deactivation
      halts later contacts.
    category: core_logic
  R5:
    text: Spawn and teleport use endpoint-only contact for their frame; pre-collision
      deactivation prevents contact and reuse clears history and capacity.
    category: core_logic
  R6:
    text: Save/restore and replay preserve contacts and activation state, including
      changed continuations after a discarded future.
    category: core_logic
