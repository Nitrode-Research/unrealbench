# integration_tests: multiprocess GGPO / subprocess tests. These run by default and are
# the source of flakiness (child-editor subprocess, loopback UDP peers). They are excluded
# from the reward filter and run separately as a non-reward gate under the
# NightSkyIntegration.Modifiers.* filter. Their requirement mappings are preserved here.
integration_tests:
  # RenderedRuleDuration does pixel/HUD readback (needs a real RHI; fails under
  # -NullRHI on a CPU RLVR fleet), so it is eval-only. R15's non-render coverage
  # remains in the reward set.
  NightSkyIntegration.Modifiers.RenderedRuleDuration:
  - R15
  # SetupSelectionStartsBattle renders the player-setup widget ("render actual
  # player setup" returns null under -NullRHI), so it is eval-only on a CPU fleet.
  # R20 (authorable setup-summary display) is therefore eval-only; its reward
  # coverage was a hollow text-grep anyway (see verifier assessment m15).
  NightSkyIntegration.Modifiers.SetupSelectionStartsBattle:
  - R20
  NightSkyIntegration.Modifiers.FreshProcessReplay:
  - R16
  NightSkyIntegration.Modifiers.GGPOConfirmedReplay:
  - R17
  NightSkyIntegration.Modifiers.PeerMismatchBlocksPlay:
  - R18
tests:
  runner: ue_automation
  mode: editor
  num_clients: 0
  filter: NightSky.Modifiers
  command_line:
    remove_args:
    - -NullRHI
    add_args:
    - -d3d11
    - -sm5
    - -AllowSoftwareRendering
    - -RenderOffScreen
    - -NoSound
