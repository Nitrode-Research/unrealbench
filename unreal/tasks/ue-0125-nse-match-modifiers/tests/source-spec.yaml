hidden_requirements:
  R1:
    text: Ordered damage transforms, ASCII priority tie-breaking and per-operation clamping.
    category: core_logic
  R2:
    text: Conversion suppresses both ordinary meter gains and preserves authored children.
    category: core_logic
  R3:
    text: A rule affects each event at most once along a parent-to-descendant chain; cancellation discards that event and its pending descendants.
    category: core_logic
  R4:
    text: Children complete depth first with branch-local cancellation and per-commit meter clamping.
    category: core_logic
  R5:
    text: Validate all scheduled rounds and exclusive-group conflicts.
    category: core_logic
  R6:
    text: Frame durations, next-step deactivation and gameplay checkpoint/restore outcomes.
    category: core_logic
  R7:
    text: Arithmetic follows the declared operation order, flooring and clamping independently of registration or selection order.
    category: core_logic
  R8:
    text: Ordinary fighter contacts apply the active composed damage rules.
    category: core_logic
  R9:
    text: Persist replay configuration and reject unavailable or changed revisions.
    category: core_logic
  R10:
    text: The playable frame clock advances through hitstop and superfreeze and holds during pause, introductions and round results.
    category: core_logic
  R11:
    text: The four configurable shipped rules compose with their declared activation, conversion, movement, drain and victory behavior.
    category: core_logic
  R12:
    text: Author deactivation removes only owned future attacks and overlapping movement restrictions
      remain.
    category: core_logic
  R13:
    text: Rollback restores rule clocks and owned effects; a corrected deactivation removes the discarded continuation's future effects.
    category: core_logic
  R14:
    text: Recorded input playback uses the saved immutable modifier configuration and required revisions.
    category: core_logic
  R15:
    text: The in-game display shows active rule names and remaining simulation frames without presentation advancing the rule clock.
    category: core_logic
  R16:
    text: Saved replays reproduce confirmed health, meter, movement, round results, rule durations and owned effects after restart.
    category: core_logic
  R17:
    text: Corrected online play and saved replay reproduce combat and rule lifecycles through nested events, cancellation, round transitions, match results and rematches.
    category: core_logic
  R18:
    text: Incompatible peer rule definitions or configurations block play and identify the offending rule and reason.
    category: core_logic
  R19:
    text: Registration and selection order do not change ordered rule outcomes; pause, rollback and replay preserve the specified gameplay and lifecycle.
    category: core_logic
  R20:
    text: Player-facing authoring and setup controls select rules and timing, reject invalid configurations and provide the configured playable match and rule display.
    category: core_logic
  R21:
    text: Nested damage and meter events preserve ordered handlers, conversion, cancellation and authored deactivation semantics.
    category: core_logic
  R22:
    text: Movement restriction suppresses new walk, dash and jump commands while preserving existing momentum, knockback and attacks; expiry restores ordinary movement.
    category: core_logic
  R23:
    text: Sudden death evaluates positive committed health damage after all frame events, including simultaneous damage. Round transitions and rematches reset the configured rule lifecycle without stale effects, and inactive sudden death leaves ordinary victory rules in force.
    category: core_logic
